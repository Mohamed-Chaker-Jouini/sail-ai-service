services:

  vllm:
    image: vllm/vllm-openai:latest

    container_name: sail-vllm

    runtime: nvidia

    ports:
      - "8001:8001"

    environment:
      HUGGING_FACE_HUB_TOKEN: ""

    command:
      - --model
      - Qwen/Qwen3-32B-Instruct
      - --host
      - 0.0.0.0
      - --port
      - "8001"

    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface

    restart: unless-stopped

  api:
    build: .

    container_name: sail-ai-api

    depends_on:
      - vllm

    ports:
      - "8000:8000"

    environment:
      LLM_BASE_URL: http://vllm:8001
      LLM_MODEL: Qwen/Qwen3-32B-Instruct

    restart: unless-stopped