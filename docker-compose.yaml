services:
  api:
    build:
      context: .
      args:
        HTTP_PROXY: "http://10.93.144.53:8080"
        HTTPS_PROXY: "http://10.93.144.53:8080"
    container_name: sail-ai-api
    ports:
      - "8000:8000"
    environment:
      LLM_BASE_URL: http://host.docker.internal:8001
      LLM_MODEL: Qwen/Qwen3-32B-Instruct
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
