services:
  # ---- Your Custom API Service ----
  api:
    build:
      context: .
      args:
        HTTP_PROXY: "http://10.93.144.53:8080"
        HTTPS_PROXY: "http://10.93.144.53:8080"
    container_name: sail-ai-api
    ports:
      - "8000:8000"
    environment:
      LLM_BASE_URL: http://vllm:8001
      LLM_MODEL: Qwen/Qwen3-32B   # ← no -Instruct suffix
    depends_on:
      - vllm
    restart: unless-stopped

  # ---- vLLM Inference Service ----
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-server
    restart: unless-stopped
    ipc: host
    shm_size: 16gb                 # ← prevents shared memory OOM on large models
    ports:
      - "8001:8001"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - HTTP_PROXY=http://10.93.144.53:8080
      - HTTPS_PROXY=http://10.93.144.53:8080
      - NO_PROXY=huggingface.co,*.huggingface.co,hf.co
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model Qwen/Qwen3-32B
      --port 8001
      --max-model-len 4096
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --gpu-memory-utilization 0.95
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s           # 5 min grace period for model download+load