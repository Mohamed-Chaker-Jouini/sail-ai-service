services:
  api:
    build:
      context: .
      args:
        HTTP_PROXY: "http://10.93.144.53:8080"
        HTTPS_PROXY: "http://10.93.144.53:8080"
    container_name: sail-ai-api
    ports:
      - "8000:8000"
    environment:
      LLM_BASE_URL: http://vllm:8001
      LLM_MODEL: Qwen/Qwen3-32B
    depends_on:
      vllm:
        condition: service_healthy
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-server
    restart: unless-stopped
    ipc: host
    shm_size: 16gb
    ports:
      - "8001:8001"
    environment:
      - HF_HUB_OFFLINE=1                      # ← no network calls at all
      - TRANSFORMERS_OFFLINE=1                 # ← same for transformers
    volumes:
      - /home/ai/.cache/huggingface/hub/Qwen3-32B:/model  # ← local model, no download
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model /model
      --served-model-name Qwen/Qwen3-32B
      --port 8001
      --max-model-len 4096
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --gpu-memory-utilization 0.95
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s